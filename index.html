<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Firebase Q&A</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.container {
  width: 420px;
  margin: 30px auto;
}

.form {
  background: rgba(255,255,255,0.3);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: none;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #ff4d88;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

.card {
  background: rgba(255,255,255,0.4);
  margin-top: 15px;
  padding: 15px;
  border-radius: 15px;
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="form">
    <input id="q" placeholder="Вопрос">
    <input id="img" placeholder="URL картинки">
    <button id="sendBtn">Отправить</button>
  </div>

  <div id="list"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCtJVC7V-ifBaME3T-1FmT8nRhTPFudJfo",
  authDomain: "vitadoto-134fe.firebaseapp.com",
  projectId: "vitadoto-134fe",
  storageBucket: "vitadoto-134fe.firebasestorage.app",
  messagingSenderId: "192771065928",
  appId: "1:192771065928:web:c3998e97c530c4814a307d",
  databaseURL: "https://vitadoto-134fe-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

---

# 📤 ОТПРАВКА (КНОПКА РАБОТАЕТ 100%)

document.getElementById("sendBtn").addEventListener("click", function () {
  const q = document.getElementById("q").value;
  const img = document.getElementById("img").value;

  firebase.database().ref("questions").push({
    question: q,
    image: img,
    answer: ""
  });

  document.getElementById("q").value = "";
  document.getElementById("img").value = "";
});

---

# 👀 ВЫВОД ДАННЫХ

const list = document.getElementById("list");

firebase.database().ref("questions").on("value", (snap) => {
  const data = snap.val();
  list.innerHTML = "";

  for (let id in data) {
    const item = data[id];

    list.innerHTML += `
      <div class="card">
        <b>❓ ${item.question}</b><br>
        <img src="${item.image}">
        <p>💬 ${item.answer || "нет ответа"}</p>
      </div>
    `;
  }
});

</script>

</body>
</html>

<input id="q" placeholder="Ваш вопрос">
<input id="img" placeholder="URL картинки">
<button onclick="send()">Отправить</button>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, set, onValue, update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtJVC7V-ifBaME3T-1FmT8nRhTPFudJfo",
  authDomain: "vitadoto-134fe.firebaseapp.com",
  projectId: "vitadoto-134fe",
  storageBucket: "vitadoto-134fe.firebasestorage.app",
  messagingSenderId: "192771065928",
  appId: "1:192771065928:web:c3998e97c530c4814a307d",
  measurementId: "G-7Z2Y1SMQBT"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

---

# 📤 1. ОТПРАВКА ВОПРОСА

window.send = function () {
  const q = document.getElementById("q").value;
  const img = document.getElementById("img").value;

  const newRef = push(ref(db, "questions"));

  set(newRef, {
    question: q,
    image: img,
    answer: "",
    status: "pending"
  });
};

---

# 👀 2. ПОКАЗ ВСЕХ ВОПРОСОВ

const list = document.getElementById("list");

onValue(ref(db, "questions"), (snap) => {
  const data = snap.val();
  list.innerHTML = "";

  for (let id in data) {
    const item = data[id];

    list.innerHTML += `
      <div style="border:1px solid #000; margin:10px; padding:10px">
        <img src="${item.image}" width="120"><br>
        <b>Вопрос:</b> ${item.question}<br>
        <b>Ответ:</b> ${item.answer || "нет ответа"}<br>

        <input id="a-${id}" placeholder="Ответ админа">
        <button onclick="answer('${id}')">Ответить</button>
      </div>
    `;
  }
});

---

# 🧑‍💻 3. ОТВЕТ АДМИНА

window.answer = function (id) {
  const text = document.getElementById("a-" + id).value;

  update(ref(db, "questions/" + id), {
    answer: text,
    status: "answered"
  });
};

</script>
